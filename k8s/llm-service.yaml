apiVersion: v1
kind: Service
metadata:
  name: llm-inference
  namespace: llm-inference
  labels:
    app: llm-inference
spec:
  type: LoadBalancer
  selector:
    app: llm-inference
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600

