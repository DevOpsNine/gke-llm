apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-inference
  namespace: llm-inference
  labels:
    app: llm-inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-inference
  template:
    metadata:
      labels:
        app: llm-inference
    spec:
      # Tolerate GPU taint to schedule on GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: "present"
        effect: NoSchedule
      
      # Ensure pods are scheduled on GPU nodes
      nodeSelector:
        workload: gpu-llm
      
      containers:
      - name: vllm
        # vLLM is a fast inference server for LLMs
        # Replace with your preferred LLM serving framework (e.g., TGI, vLLM, TensorRT-LLM)
        image: vllm/vllm-openai:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        # Model configuration
        - name: MODEL_NAME
          value: "mistralai/Mistral-7B-Instruct-v0.2"  # Change to your desired model
        
        # GPU configuration
        - name: TENSOR_PARALLEL_SIZE
          value: "1"
        
        - name: GPU_MEMORY_UTILIZATION
          value: "0.9"
        
        # Performance tuning
        - name: MAX_MODEL_LEN
          value: "4096"
        
        - name: DTYPE
          value: "half"  # Use half precision for better performance
        
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --host
        - "0.0.0.0"
        - --port
        - "8000"
        - --model
        - $(MODEL_NAME)
        - --tensor-parallel-size
        - $(TENSOR_PARALLEL_SIZE)
        - --gpu-memory-utilization
        - $(GPU_MEMORY_UTILIZATION)
        - --max-model-len
        - $(MAX_MODEL_LEN)
        - --dtype
        - $(DTYPE)
        
        resources:
          requests:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
          limits:
            memory: "32Gi"
            cpu: "8"
            nvidia.com/gpu: "1"
        
        # Liveness and readiness probes
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 300
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Volume mounts for model caching
        volumeMounts:
        - name: model-cache
          mountPath: /root/.cache/huggingface
      
      volumes:
      - name: model-cache
        emptyDir:
          sizeLimit: 50Gi

